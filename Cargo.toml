[package]
name = "residuum"
version = "0.1.0"
edition = "2024"

[dependencies]
chumsky = { version = "=0.9.3", default-features = false }

# Los binarios de tests compilan sin símbolos de depuración: con `debug = 2` la
# compilación desde cero del target de tests supera el freno de 768 MiB del
# runner. Medido en docs/compile-cost-optimizations.md.
[profile.test]
debug = 0

# Familias de tests. Sin ninguna, se compilan todos los tests como antes. Con
# una o más, sólo esas familias más el núcleo, para que cada binario de tests
# quede lejos del freno del runner (docs/compile-cost-optimizations.md, palanca 2).
[features]
test-families = []
test-core = ["test-families"]
test-residual = ["test-families"]
test-experiments = ["test-families"]
test-legal-geometry = ["test-families"]
test-legal-learning = ["test-families"]
